[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-deck-sonic-forge"
version = "0.1.0"
description = "Bilingual speech, audio and music add-on for ControlDeck"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "cryptography>=43,<47",
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]
release = [
  "cryptography>=43,<47",
  "pyinstaller>=6,<7",
]

[project.scripts]
sonic-forge = "sonicforge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/sonicforge"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend", "."]
testpaths = ["tests"]
